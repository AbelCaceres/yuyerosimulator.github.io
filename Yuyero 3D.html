.pop{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:"Lilita One",Impact,sans-serif;font-size:2.2rem;color:#fff;text-shadow:0 3px 0 #1d2a44,0 0 12px #1d2a44;pointer-events:none;animation:up 1s forwards}@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}@media (prefers-reduced-motion:reduce){.pop{animation:none}}

 $("#ov").style.display="flex";$("#ov").innerHTML=`<div><h1>¡Se acabó la tarde!</h1><p>Ganaste Gs. ${st.gs.toLocaleString("es-PY")}<br>${st.served} clientes felices · ${st.lost} perdidos</p><p>${nb?"🏆 ¡Nuevo récord!":"Récord: Gs. "+best.toLocaleString("es-PY")}</p><button onclick="start()">Jugar otra vez</button></div>`}
function start(){cust.forEach(c=>S.remove(c.g));cust=[];cur=null;st={t:60,gs:0,served:0,lost:0,mix:[],hits:0,mt:0,combo:0,lv:0,cold:100,icet:0};$("#ov").style.display="none";ac();music(true);run=true;spawn();ui()}
$("#ov").innerHTML=`<div><h1>Yuyero 3D</h1><p>Ponete detrás del puesto. Tocá los yuyos que pide el cliente, machacalos en el mortero y servile el tereré. Arrastrá para mirar alrededor. Cuidá el termo: el sol lo calienta y con el tereré tibio pagan menos. Recargá hielo con 🧊 (cuesta Gs. 1.000). Tenés 60 segundos.</p>${best?`<p>Récord: Gs. ${best.toLocaleString("es-PY")}</p>`:""}<button onclick="start()">Empezar</button></div>`;
$("#clr").onclick=()=>st&&clearMix();$("#ice").onclick=()=>ice();$("#mu").onclick=()=>{mute=!mute;$("#mu").textContent=mute?"🔇":"🔊";music(!mute&&run)};$("#serve").onclick=()=>st&&run&&serve();

const ray=new THREE.Raycaster(),v=new THREE.Vector2();let dn=null,drag=0;
R.domElement.addEventListener("pointerdown",e=>{dn=[e.clientX,e.clientY];drag=0});
R.domElement.addEventListener("pointermove",e=>{if(!dn)return;const dx=e.clientX-dn[0],dy=e.clientY-dn[1];
 if(drag||Math.hypot(dx,dy)>10){drag=1;yaw=Math.max(-.6,Math.min(.6,yaw-dx*.004));pitch=Math.max(-.15,Math.min(.2,pitch-dy*.003));dn=[e.clientX,e.clientY]}});
R.domElement.addEventListener("pointerup",e=>{if(!drag&&run){v.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v,C);
 const h=ray.intersectObjects(pick,false)[0];if(h){const u=h.object.userData;if(u.herb!==undefined)add(u.herb);else if(u.mortar)pound();else if(u.ice)ice()}}dn=null});
function size(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener("resize",size);size();

function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 C.rotation.y=yaw;C.rotation.x=-.2+pitch;
 const hh=run?Math.min(1,(60-st.t)/60):0;SKT.copy(SK0).lerp(SK1,hh);S.background.copy(SKT);S.fog.color.copy(SKT);sun.intensity=.9+hh*.5;ball.position.set(8-hh*6,4.5+hh*3,-16);ball.scale.setScalar(1+hh*.5);$("#heat").style.opacity=hh*.55;
 pt=Math.max(0,pt-dt*6);pestle.position.set(.1,1.5+.2*(1-pt),.95);
 for(let i=ps.length-1;i>=0;i--){const m=ps[i],u=m.userData;u.v.y-=9*dt;m.position.addScaledVector(u.v,dt);u.l-=dt;m.scale.setScalar(Math.max(.01,u.l/.7));if(u.l<=0){S.remove(m);m.geometry.dispose();m.material.dispose();ps.splice(i,1)}}mortar.scale.setScalar(1+.03*pt);
 cust.forEach(c=>{const p=c.g.position;p.x+=(c.tx-p.x)*Math.min(1,dt*2.2);const mv=Math.abs(c.tx-p.x)>.15;p.y=c.hop>0?Math.abs(Math.sin(c.hop*9.4))*.4:mv?Math.abs(Math.sin(now/110))*.07:0;if(c.hop>0)c.hop-=dt*1.4;
  c.g.userData.head.material.color.setHex(!c.out&&c.cp/c.max<.35?0xd24a3a:c.g.userData.sk)});
 cust=cust.filter(c=>{if(c.out&&c.g.position.x<-8){S.remove(c.g);return false}return true});
 if(run){st.t-=dt;st.cold=Math.max(0,st.cold-dt*(1.1+hh*1.4));st.icet=Math.max(0,st.icet-dt);if(st.mt>0){st.mt-=dt;if(st.mt<=0){st.mt=0}}
  if(cur){cur.cp-=dt;if(cur.cp<=0){st.lost++;st.combo=0;sfx.leave();msg("😠 Se fue sin tereré");leave();spawn()}}
  if(st.t<=0)over();
  $("#pat").style.width=(cur?Math.max(0,cur.cp/cur.max*100):0)+"%";$("#pat").style.background=cur&&cur.cp/cur.max<.35?"var(--red)":"var(--green)";ui()}
 R.render(S,C)}
requestAnimationFrame(loop);
</script>
